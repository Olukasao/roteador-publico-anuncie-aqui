          const yaw = -0.1 + 0.08 * easeInOut(ramp(t, 0, 4));
          camera.position.set(Math.sin(yaw) * dist, dist * 0.1, Math.cos(yaw) * dist);
          camera.lookAt(0, 0, 0);

          spin.rotation.y = SPIN0 + integrate(spinSpeed, t, 160);
          const s = 0.9 + 0.1 * emerge;
          tilt.scale.setScalar(s);

          bgMat.uniforms.uGlow.value = smooth(ramp(t, 0.0, 0.55)) * (1 - 0.6 * smooth(ramp(t, 0.8, 2.0)));
          coreMat.uniforms.uBright.value = dim * (0.35 + 0.65 * emerge);
          coreMat.uniforms.uAlpha.value = smooth(ramp(t, 0.05, 0.85));
          atmoMat.uniforms.uBright.value = bright * (0.85 + 0.15 * Math.sin(t * 1.6));
          landMat.uniforms.uTime.value = t;
          landMat.uniforms.uReveal.value = 1.2 * easeOutCubic(ramp(t, 0.2, 1.6));
          landMat.uniforms.uBright.value = bright;

          orbits.forEach((o) => {
            const d = easeOutCubic(ramp(t, o.draw[0], o.draw[1]));
            o.mat.uniforms.uDraw.value = 1.02 * d;
            o.mat.uniforms.uAlpha.value = dim * (0.25 + 0.75 * smooth(ramp(t, 0.8, 1.4)));
            const h = o.speed * flowPos;
            o.mat.uniforms.uHeads.value.set(h + o.heads[0], h + o.heads[1], -9, -9);
            o.mat.uniforms.uTail.value = 0.12 + 0.1 * smooth(ramp(t, 1.7, 2.6));
          });

          streaks.forEach((st) => {
            const on = smooth(ramp(t, st.start, st.start + 0.2));
            st.mat.uniforms.uAlpha.value = on * dim * 1.25;
            st.mat.uniforms.uHeads.value.set(st.offset + st.speed * (flowPos - st.start), -9, -9, -9);
          });

          arcs.forEach((a) => {
            const p = ramp(t, a.start, a.start + 0.45);
            a.mat.uniforms.uDraw.value = 1.03 * easeOutCubic(p);
            a.mat.uniforms.uAlpha.value = dim * (p > 0 ? 1 : 0);
            // Cabeça de desenho + pacotes que voltam a correr depois do arco pronto.
            const head = 1.03 * easeOutCubic(p);
            const pk = t > a.start + 0.45 ? (flowPos * 0.9 + a.phase) % 1.25 : -9;
            a.mat.uniforms.uHeads.value.set(p < 1 ? head : -9, pk, -9, -9);
          });

          nodeMat.uniforms.uTime.value = t;
          nodeMat.uniforms.uAlpha.value = dim;

          particles.rotation.y = 0.05 * t;
          partMat.uniforms.uTime.value = t;
          partMat.uniforms.uAlpha.value = smooth(ramp(t, 0.05, 0.7)) * (1 - 0.35 * smooth(ramp(t, 2.8, 3.3)));

          composer.render();
        }

        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(window.__hfThreeTime || 0);
      </script></body>
</html>
