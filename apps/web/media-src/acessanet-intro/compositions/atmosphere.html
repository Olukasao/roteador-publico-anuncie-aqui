<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <!-- Camada de ambiente: véu escuro inicial, névoa volumétrica, feixe de luz difuso,
         vinheta e partículas (posições de PRNG com semente fixa). Layout em px a partir do
         centro do quadro: serve igual para 1080×1920 e 1920×1080. -->
  </head>
  <body>
    <template>
      <style>
        /* A camada sempre preenche o host (vertical ou horizontal): o runtime carimba o
           data-width/height deste arquivo na raiz, então o tamanho é forçado aqui. */
        #root {
          position: absolute;
          inset: 0;
          width: 100% !important;
          height: 100% !important;
          overflow: hidden;
        }
        #atm-fog-low,
        #atm-fog-high {
          position: absolute;
          left: 50%;
          top: 50%;
          border-radius: 50%;
          opacity: 0;
        }
        #atm-fog-low {
          width: 1600px;
          height: 1150px;
          margin: -515px 0 0 -800px;
          background: radial-gradient(
            closest-side,
            rgba(37, 125, 255, 0.3) 0%,
            rgba(17, 102, 189, 0.13) 45%,
            rgba(6, 21, 45, 0) 100%
          );
        }
        #atm-fog-high {
          width: 1700px;
          height: 900px;
          margin: -1080px 0 0 -850px;
          background: radial-gradient(
            closest-side,
            rgba(147, 197, 253, 0.11) 0%,
            rgba(37, 125, 255, 0.06) 50%,
            rgba(6, 21, 45, 0) 100%
          );
        }
        #atm-ray-pivot {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 0;
          height: 0;
          transform: rotate(24deg);
        }
        #atm-ray {
          position: absolute;
          left: -260px;
          top: -1500px;
          width: 520px;
          height: 3000px;
          background: linear-gradient(
            90deg,
            rgba(147, 197, 253, 0) 0%,
            rgba(147, 197, 253, 0.07) 42%,
            rgba(214, 232, 255, 0.11) 50%,
            rgba(147, 197, 253, 0.07) 58%,
            rgba(147, 197, 253, 0) 100%
          );
          filter: blur(24px);
          opacity: 0;
        }
        #atm-veil {
          position: absolute;
          inset: 0;
          background: #06152d;
          opacity: 0;
        }
        #atm-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(
            closest-corner at 50% 46%,
            rgba(3, 10, 24, 0) 55%,
            rgba(3, 10, 24, 0.6) 100%
          );
        }
        #atm-particles {
          position: absolute;
          left: 50%;
          top: calc(50% - 60px);
          width: 0;
          height: 0;
        }
        .atm-p {
          position: absolute;
          border-radius: 50%;
          background: #d6e8ff;
          box-shadow: 0 0 6px 1px rgba(147, 197, 253, 0.55);
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-ozdr" id="root" data-composition-id="atmosphere" data-width="1080" data-height="1920">
        <div data-hf-id="hf-vq3u" id="atm-fog-low" data-layout-ignore=""></div>
        <div data-hf-id="hf-55o0" id="atm-fog-high" data-layout-ignore=""></div>
        <div data-hf-id="hf-jac3" id="atm-ray-pivot"><div data-hf-id="hf-5cyc" id="atm-ray"></div></div>
        <div data-hf-id="hf-lc6g" id="atm-veil"></div>
        <div data-hf-id="hf-os6e" id="atm-vignette"></div>
        <div data-hf-id="hf-33rt" id="atm-particles"></div>
      </div>

      <script>
        (function () {
          // PRNG com semente fixa: as mesmas partículas em todo frame e em todo render.
          let seed = 0x5eed2026;
          const rand = () => {
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };

          const host = document.getElementById("atm-particles");
          const particles = [];
          for (let i = 0; i < 30; i++) {
            const size = 1.6 + rand() * 2.6;
            const angle = rand() * Math.PI * 2;
            const radius = 260 + rand() * 720;
            const p = document.createElement("div");
            p.className = "atm-p";
            p.style.width = p.style.height = size.toFixed(2) + "px";
            p.style.left = (Math.cos(angle) * radius * 0.85 - size / 2).toFixed(1) + "px";
            p.style.top = (Math.sin(angle) * radius - size / 2).toFixed(1) + "px";
            host.appendChild(p);
            particles.push({
              el: p,
              dx: -Math.cos(angle) * radius * 0.85,
              dy: -Math.sin(angle) * radius,
              alpha: 0.25 + rand() * 0.55,
              t0: rand() * 0.55,
            });
          }

          const tl = gsap.timeline({ paused: true });

          // Cena 1 → 2: o véu escuro se abre até revelar o fundo exato da tela de login.
          tl.fromTo("#atm-veil", { opacity: 1 }, { opacity: 0.5, duration: 0.8, ease: "sine.inOut" }, 0)
            .to("#atm-veil", { opacity: 0, duration: 1.1, ease: "sine.inOut" }, 0.8);

          // Névoa volumétrica: cresce devagar e respira atrás da marca.
          tl.fromTo("#atm-fog-low", { opacity: 0, scale: 0.78 }, { opacity: 1, scale: 1.06, duration: 2.4, ease: "sine.out" }, 0.1)
            .fromTo("#atm-fog-high", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 1.8, ease: "sine.out" }, 0.3)
            .to("#atm-ray", { opacity: 1, duration: 0.9, ease: "sine.out" }, 0.05)
            .fromTo("#atm-ray", { x: -340 }, { x: 300, duration: 2.8, ease: "sine.inOut" }, 0.05);

          // Partículas: surgem em tempos variados e são puxadas para o centro (pico de velocidade
          // na convergência, depois quase param).
          particles.forEach((p) => {
            tl.fromTo(p.el, { opacity: 0 }, { opacity: p.alpha, duration: 0.45, ease: "sine.out" }, p.t0)
              .fromTo(p.el, { x: 0, y: 0 }, { x: p.dx * 0.26, y: p.dy * 0.26, duration: 1.15 - p.t0 * 0.3, ease: "power2.in" }, p.t0)
              .to(p.el, { x: p.dx * 0.33, y: p.dy * 0.33, duration: 1.6, ease: "sine.out" }, 1.4);
          });

          // Cena 4: tudo some, sobra só o gradiente do PortalShell.
          tl.to(["#atm-fog-low", "#atm-fog-high", "#atm-ray"], { opacity: 0, duration: 0.48, ease: "power1.in" }, 2.38)
            .to(".atm-p", { opacity: 0, duration: 0.4, ease: "power1.in" }, 2.35)
            .to("#atm-vignette", { opacity: 0, duration: 0.55, ease: "sine.inOut" }, 2.32);

          window.__timelines["atmosphere"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
