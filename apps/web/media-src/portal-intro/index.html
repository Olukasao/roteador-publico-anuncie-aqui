<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #06152d;
      }
      #root {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        /* Mesmo fundo do PortalShell do app: o último frame emenda na tela de login. */
        background:
          radial-gradient(70% 55% at 50% 0%, rgba(37, 125, 255, 0.22) 0%, rgba(6, 21, 45, 0) 70%),
          radial-gradient(45% 35% at 85% 85%, rgba(147, 197, 253, 0.08) 0%, rgba(6, 21, 45, 0) 70%),
          linear-gradient(180deg, #06152d 0%, #0a2250 55%, #06152d 100%);
      }
      .layer { position: absolute; inset: 0; }

      .beam {
        position: absolute;
        top: -30%;
        height: 160%;
        border-radius: 999px;
        filter: blur(28px);
        opacity: 0;
      }
      #beam1 { left: 6%;  width: 90px;  transform: rotate(16deg);
        background: linear-gradient(180deg, rgba(56,189,248,0) 0%, rgba(56,189,248,0.55) 50%, rgba(56,189,248,0) 100%); }
      #beam2 { left: 46%; width: 60px;  transform: rotate(-12deg);
        background: linear-gradient(180deg, rgba(37,125,255,0) 0%, rgba(37,125,255,0.6) 50%, rgba(37,125,255,0) 100%); }
      #beam3 { left: 74%; width: 110px; transform: rotate(10deg);
        background: linear-gradient(180deg, rgba(125,211,252,0) 0%, rgba(125,211,252,0.4) 50%, rgba(125,211,252,0) 100%); }
      #beam4 { left: 28%; width: 40px;  transform: rotate(-22deg);
        background: linear-gradient(180deg, rgba(147,197,253,0) 0%, rgba(147,197,253,0.45) 50%, rgba(147,197,253,0) 100%); }

      #grid {
        opacity: 0;
        background-image:
          linear-gradient(rgba(125,211,252,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125,211,252,0.07) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: radial-gradient(50% 32% at 50% 50%, #000 0%, transparent 100%);
        mask-image: radial-gradient(50% 32% at 50% 50%, #000 0%, transparent 100%);
      }

      #glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 620px;
        height: 620px;
        margin: -310px 0 0 -310px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(37,125,255,0.42) 0%, rgba(37,125,255,0.12) 38%, rgba(6,21,45,0) 70%);
        opacity: 0;
      }

      #streak {
        position: absolute;
        left: 0;
        top: 50%;
        width: 720px;
        height: 3px;
        margin-top: -1.5px;
        transform-origin: 0 50%;
        background: linear-gradient(90deg, rgba(125,211,252,0) 0%, rgba(186,230,253,0.95) 70%, #ffffff 100%);
        box-shadow: 0 0 18px 4px rgba(56,189,248,0.7), 0 0 60px 12px rgba(37,125,255,0.45);
        opacity: 0;
      }

      #logoBox {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 440px;
        height: 164px;
        margin: -82px 0 0 -220px;
        overflow: hidden;
      }
      #logoClip {
        position: absolute;
        left: 0;
        top: 0;
        height: 164px;
        width: 0;
        overflow: hidden;
      }
      #logo { display: block; width: 440px; height: 164px; }
      #glintMask {
        position: absolute;
        inset: 0;
        overflow: hidden;
        -webkit-mask-image: url(assets/logo.png);
        mask-image: url(assets/logo.png);
        -webkit-mask-size: 440px 164px;
        mask-size: 440px 164px;
      }
      #glint {
        position: absolute;
        top: -40px;
        left: 0;
        width: 70px;
        height: 244px;
        transform: rotate(18deg);
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
        mix-blend-mode: screen;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="720" data-height="1280">
      <div id="beams" class="layer clip" data-start="0" data-duration="2.6">
        <div id="beam1" class="beam"></div>
        <div id="beam2" class="beam"></div>
        <div id="beam3" class="beam"></div>
        <div id="beam4" class="beam"></div>
      </div>
      <div id="grid" class="layer clip" data-start="0" data-duration="2.6"></div>
      <div id="glow" class="clip" data-start="0" data-duration="2.6"></div>
      <div id="streak" class="clip" data-start="0" data-duration="2.6"></div>
      <div id="logoBox" class="clip" data-start="0" data-duration="2.6">
        <div id="logoClip"><img id="logo" src="assets/logo.png" alt="AcessaNet" /></div>
        <div id="glintMask"><div id="glint"></div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Feixes de luz entram e varrem lentamente durante toda a intro.
      tl.to("#beam1", { opacity: 0.9, duration: 0.6, ease: "power2.out" }, 0)
        .fromTo("#beam1", { x: -80 }, { x: 70, duration: 2.6, ease: "sine.inOut" }, 0)
        .to("#beam2", { opacity: 0.8, duration: 0.6, ease: "power2.out" }, 0.15)
        .fromTo("#beam2", { x: 90 }, { x: -60, duration: 2.45, ease: "sine.inOut" }, 0.15)
        .to("#beam3", { opacity: 0.7, duration: 0.6, ease: "power2.out" }, 0.3)
        .fromTo("#beam3", { x: -40 }, { x: 60, duration: 2.3, ease: "sine.inOut" }, 0.3)
        .to("#beam4", { opacity: 0.6, duration: 0.5, ease: "power2.out" }, 0.45)
        .fromTo("#beam4", { x: 60 }, { x: -50, duration: 2.15, ease: "sine.inOut" }, 0.45);

      // Grade sutil de "rede" aparece atrás do logo.
      tl.to("#grid", { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.3)
        .to("#grid", { opacity: 0.35, duration: 0.9, ease: "power1.inOut" }, 1.5);

      // Traço de luz cruza a tela e "desenha" o logo da esquerda para a direita.
      tl.set("#streak", { opacity: 1, scaleX: 0 }, 0.35)
        .to("#streak", { scaleX: 1, duration: 0.75, ease: "power3.inOut" }, 0.35)
        .to("#streak", { opacity: 0, duration: 0.35, ease: "power1.in" }, 1.0)
        .to("#logoClip", { width: 440, duration: 0.75, ease: "power3.inOut" }, 0.45)
        .fromTo("#logoBox", { scale: 0.92 }, { scale: 1, duration: 1.4, ease: "power3.out" }, 0.45);

      // Brilho azul atrás do logo e reflexo (glint) final.
      tl.fromTo("#glow", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.7)
        .to("#glow", { opacity: 0.55, duration: 0.8, ease: "sine.inOut" }, 1.7)
        .set("#glint", { opacity: 1, x: -120 }, 1.3)
        .to("#glint", { x: 520, duration: 0.6, ease: "power2.inOut" }, 1.3)
        .set("#glint", { opacity: 0 }, 1.9);

      // Acalma os feixes no fim: o último frame fica limpo para emendar na tela de login.
      tl.to(["#beam1", "#beam2", "#beam3", "#beam4"], { opacity: 0.25, duration: 0.6, ease: "power1.inOut" }, 2.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
